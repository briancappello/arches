#
# Arches pacman.conf — x86-64 with CachyOS v3 repos
# CachyOS v3 repos above Arch repos for optimized packages
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# CachyOS v3 optimized repos (AVX2/SSE4.2 — 2011+ hardware)
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# CachyOS base repo (kernels, tooling)
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Pre-built local repo (AUR packages baked into ISO)
# Signed with the arches-local key on the operator's YubiKey (keys/README.md).
# The installer adds that key to the keyring. pacman cannot pin a key to one
# repo: any key the keyring trusts verifies here, and agents hold none.
[arches-local]
SigLevel = Required
Server = file:///opt/arches-repo

# Arch repos
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Multilib (32-bit compatibility libraries)
[multilib]
Include = /etc/pacman.d/mirrorlist
