#
# Arches pacman.conf — aarch64-generic with Arch Linux ARM repos
#

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Arch Linux ARM repos
[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo

# Pre-built local repo (AUR packages baked into ISO)
# Signed with the arches-local key on the operator's YubiKey (keys/README.md).
# The installer adds that key to the keyring. pacman cannot pin a key to one
# repo: any key the keyring trusts verifies here, and agents hold none.
[arches-local]
SigLevel = Required
Server = file:///opt/arches-repo
