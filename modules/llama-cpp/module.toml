[meta]
name = "llama.cpp (Vulkan)"
description = "llama.cpp build tooling — dependencies installed, binary not shipped"
category = "service"

[install.pacstrap]
packages = [
    # We no longer ship a pre-built llama.cpp binary. Instead we install
    # the build dependencies so the user can build from source on the
    # installed system using the /usr/local/bin/llama-cpp-update helper.
    #
    "base-devel",
    "python",
    # Vulkan runtime (also pulled by chwd, listed for clarity)
    "vulkan-icd-loader",
    "vulkan-radeon",
    # Build tooling for /usr/local/bin/llama-cpp-update
    "git",
    "cmake",
    "ninja",
    "openssl",
    "openblas",
    "vulkan-headers",
    "shaderc",
    "spirv-headers",
]

[dependencies]
conflicts = ["llama-cpp-hip", "llama-cpp-cuda"]
