---
# ==========================================================================
# Oh-My-Zsh role — shell configuration for regular user and root
# ==========================================================================
# Regular user: bullet-train theme (Powerline prompt)
# Root user:    fino theme (visually distinct so it's obvious you are root)
#
# New media stages a verified bundle and helper before firstboot. Older media
# and standalone online runs retain their existing Git acquisition behavior.
# ==========================================================================

# --------------------------------------------------------------------------
# Regular user setup
# --------------------------------------------------------------------------

- name: Detect offline Oh My Zsh contract
  stat:
    path: /opt/arches/ohmyzsh.py
  register: zsh_offline

- name: Detect offline Oh My Zsh manifest
  stat:
    path: /opt/arches/firstboot-assets.json
  register: zsh_asset_contract

- name: Require complete offline Oh My Zsh contract
  assert:
    that:
      - not (zsh_offline_required | default(false)) or (zsh_offline.stat.exists and zsh_asset_contract.stat.exists)
      - zsh_offline.stat.exists == zsh_asset_contract.stat.exists
    fail_msg: "Incomplete Oh My Zsh offline assets; restore the staged manifest and helper."

- name: Install offline oh-my-zsh for {{ zsh_user }}
  become_user: "{{ zsh_user }}"
  command:
    argv:
      - python3
      - /opt/arches/ohmyzsh.py
      - /opt/arches
      - "{{ zsh_user_home }}/.oh-my-zsh"
  register: zsh_checkout
  changed_when: zsh_checkout.stdout == 'changed'
  when: zsh_offline.stat.exists

- name: Clone oh-my-zsh for {{ zsh_user }}
  become_user: "{{ zsh_user }}"
  git:
    repo: "{{ zsh_omz_repo }}"
    dest: "{{ zsh_user_home }}/.oh-my-zsh"
    depth: "{{ zsh_omz_depth }}"
    version: master
    update: no
  when: not zsh_offline.stat.exists

- name: Create custom themes directory for {{ zsh_user }}
  become_user: "{{ zsh_user }}"
  file:
    path: "{{ zsh_user_home }}/.oh-my-zsh/custom/themes"
    state: directory
    mode: '0755'

- name: Install bullet-train theme for {{ zsh_user }}
  become_user: "{{ zsh_user }}"
  copy:
    src: bullet-train.zsh-theme
    dest: "{{ zsh_user_home }}/.oh-my-zsh/custom/themes/bullet-train.zsh-theme"
    mode: '0644'

- name: Deploy .zshrc for {{ zsh_user }}
  become_user: "{{ zsh_user }}"
  template:
    src: zshrc-user.j2
    dest: "{{ zsh_user_home }}/.zshrc"
    mode: '0644'

# --------------------------------------------------------------------------
# Root user setup
# --------------------------------------------------------------------------

- name: Install offline oh-my-zsh for root
  command:
    argv:
      - python3
      - /opt/arches/ohmyzsh.py
      - /opt/arches
      - /root/.oh-my-zsh
  register: zsh_checkout
  changed_when: zsh_checkout.stdout == 'changed'
  when: zsh_offline.stat.exists

- name: Clone oh-my-zsh for root
  git:
    repo: "{{ zsh_omz_repo }}"
    dest: /root/.oh-my-zsh
    depth: "{{ zsh_omz_depth }}"
    version: master
    update: no
  when: not zsh_offline.stat.exists

- name: Deploy .zshrc for root
  template:
    src: zshrc-root.j2
    dest: /root/.zshrc
    mode: '0644'
