#
# p1-balanced — AC middle tier for ThinkPad P1 Gen 7
#
# Intel Core Ultra 7 165H (Meteor Lake) + NVIDIA RTX 3000 Ada
#
# This is a real tier again. It previously existed only as an alias of
# p1-performance, which left the KDE panel with two slots that did exactly
# the same thing.
#
# Why a middle tier is needed:
#
# p1-performance sets EPP and EPB to `performance`, which tells the CPU to
# reach for maximum turbo on ANY runnable thread. That is the correct
# tradeoff for bursty interactive work, where the burst finishes and the
# package cools back down between bursts.
#
# It is the wrong tradeoff for a sustained background floor. Measured on
# this machine with DisplayLink driving two USB displays, a libvirt guest,
# and long-running agent sessions, roughly 3.3 cores are busy CONTINUOUSLY
# and never idle back down. Under EPP=performance every one of those
# background threads pulls maximum turbo, which holds the package at
# 62-71 C and pins the fans near 4000 RPM even though the machine is only
# ~15% busy in aggregate.
#
# This profile keeps the SAME firmware power envelope as p1-performance
# (platform_profile=balanced, so PL1 stays below PL2) and keeps turbo
# AVAILABLE, but stops the CPU from demanding peak frequency for
# everything. Short bursts still boost; a permanently runnable background
# thread no longer sits at 4.7 GHz.
#
#   EPP=balance_performance  -> boost willingly, but not unconditionally
#   EPB=normal               -> matching MSR-level hint (raw value 6)
#   no_turbo=0               -> turbo still available for bursts
#
# Everything outside [cpu] is inherited unchanged from p1-performance.
# Keep it that way: this tier differs ONLY in frequency bias.
#
# Real power savings still live in p1-powersave.
#

[main]
summary=ThinkPad P1 Gen 7 — AC middle tier (balanced EPP, balanced power envelope)
include=p1-performance

[cpu]
governor=powersave
energy_perf_bias=normal
energy_performance_preference=balance_performance
no_turbo=0
