#
# p1-performance — AC maximum-responsiveness profile for ThinkPad P1 Gen 7
#
# Intel Core Ultra 7 165H (Meteor Lake) + NVIDIA RTX 3000 Ada
#
# CPU is biased hard toward responsiveness (EPP and EPB = performance,
# turbo enabled), but the FIRMWARE power envelope is deliberately left at
# `balanced`. These are separate levers and the combination is intentional:
#
#   EPP/EPB          -> how eagerly the CPU reaches for high frequencies
#   platform_profile -> the sustained envelope the EC will allow, and the
#                       fan curve it uses to hold it
#
# platform_profile=performance sets PL1 = PL2 = 115 W, which lets the package
# sit at maximum turbo power indefinitely and pins the fans near 5200 RPM.
# `balanced` pulls PL1 back below PL2, so bursts stay fast while sustained
# load stays quiet.
#
# This profile suits BURSTY interactive work, where the package cools back
# down between bursts. For a sustained background load that never idles
# (DisplayLink, VMs, long-running agent sessions) prefer p1-balanced, which
# keeps this same power envelope but stops every background thread from
# demanding peak turbo. Battery savings live in p1-powersave.
#
# GPU is managed separately via the gpu-ollama script.
#
# NOTE ON TURBO: use `no_turbo`, not `boost`. This machine runs the
# intel_pstate driver in active mode, which exposes NO cpufreq boost knob --
# neither /sys/devices/system/cpu/cpufreq/boost nor the per-CPU variant
# exists. tuned translates `boost` into intel_pstate/no_turbo when it
# applies the profile, but it verifies `boost` against the missing cpufreq
# knob, so the older `boost=1` line made `tuned-adm verify` fail on all 22
# CPUs with "boost = 'None', expected '1'".
# tuned's `no_turbo` option writes /sys/devices/system/cpu/intel_pstate/no_turbo
# directly and is verified at instance level, so it produces no such noise.
#

[main]
summary=ThinkPad P1 Gen 7 — AC maximum responsiveness (performance EPP, balanced power envelope)

[cpu]
governor=powersave
energy_perf_bias=performance
energy_performance_preference=performance
no_turbo=0

[acpi]
platform_profile=balanced

[audio]
timeout=0

[video]
panel_power_savings=0

[disk]
readahead=>4096

[scsi_host]
alpm=max_performance

[sysctl]
vm.swappiness=10
kernel.sched_autogroup_enabled=1
kernel.nmi_watchdog=0
