[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD profile name = tuned profile name
#
# KDE always shows exactly three slots. The PPD D-Bus API
# (net.hadess.PowerProfiles, served here by tuned-ppd) hard-codes
# power-saver/balanced/performance, so a tier cannot be removed from the
# panel -- only pointed somewhere else.
#
# All three slots are now genuinely distinct:
#
#   power-saver -> p1-powersave    EPP/EPB = power,   turbo off, low-power envelope
#   balanced    -> p1-balanced     EPP = balance_performance, turbo on, balanced envelope
#   performance -> p1-performance  EPP/EPB = performance,     turbo on, balanced envelope
#
# Note that `balanced` and `performance` share the same FIRMWARE power
# envelope (platform_profile=balanced). They differ only in how eagerly the
# CPU reaches for turbo. Neither uses platform_profile=performance, which
# would set PL1 = PL2 = 115 W and pin the fans near 5200 RPM.
#
# p1-balanced was previously just an alias of p1-performance, so these two
# slots did exactly the same thing. It was restored as a real tier because
# a sustained background load (DisplayLink software framebuffer compression,
# libvirt guests, long-running agent sessions) never idles back down, and
# under EPP=performance it holds the package at 62-71 C and the fans near
# 4000 RPM.
power-saver=p1-powersave
balanced=p1-balanced
performance=p1-performance

[battery]
# On battery the "balanced" slot uses the same middle tier as on AC.
# Switch to power-saver from the KDE panel for maximum battery savings.
balanced=p1-balanced
