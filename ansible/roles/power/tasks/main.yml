---
# ============================================================================
# Power Management — ThinkPad P1 Gen 7
# ============================================================================
#
# Installs tuned + tuned-ppd with custom power profiles and sets up
# NVIDIA RTD3 for on-demand GPU power management.
#
# Profiles (switchable from KDE panel):
#   power-saver  -> p1-powersave   (turbo off, low-power firmware, wifi PS)
#   balanced     -> p1-balanced    (EPP balance_performance, balanced firmware)
#   performance  -> p1-performance (EPP performance, balanced firmware)
#
# p1-balanced includes p1-performance and overrides only [cpu]; see the
# profile headers for why neither uses platform_profile=performance.
#
# GPU + Ollama and battery charge thresholds are managed via the
# `power` CLI tool.
#
# Fan control: thinkfan replaces the EC's factory fan curve, which holds
# the CPU at ~55C with ~3,300 RPM. The custom curve lets it settle at
# ~60-70C with ~2,300-2,800 RPM. See files/thinkfan.yaml for the curve
# and the measurements behind it; re-measure with
# /usr/local/lib/power/fan-test.
# ============================================================================

# --------------------------------------------------------------------------
# 1. Packages
# --------------------------------------------------------------------------
- name: "Power: install tuned and tuned-ppd"
  pacman:
    name:
      - tuned
      - tuned-ppd
    state: present

# --------------------------------------------------------------------------
# 2. NVIDIA RTD3 — now handled by hardware quirk (nvidia-rtd3-laptop)
# --------------------------------------------------------------------------
# The modprobe config and udev rules for NVIDIA RTD3 are deployed at
# install time by the nvidia-rtd3-laptop hardware quirk.  The files
# are kept in hardware/quirks/nvidia-rtd3-laptop/ for reference.

# --------------------------------------------------------------------------
# 3. Tuned profiles
# --------------------------------------------------------------------------
- name: "Power: create tuned profiles directory"
  file:
    path: "/etc/tuned/profiles/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - p1-powersave
    - p1-balanced
    - p1-performance

- name: "Power: deploy p1-powersave profile"
  copy:
    src: "tuned/p1-powersave/{{ item.src }}"
    dest: "/etc/tuned/profiles/p1-powersave/{{ item.src }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: tuned.conf, mode: "0644" }
    - { src: script.sh,  mode: "0755" }
  register: power_tuned_powersave

- name: "Power: deploy p1-balanced profile"
  copy:
    src: tuned/p1-balanced/tuned.conf
    dest: /etc/tuned/profiles/p1-balanced/tuned.conf
    mode: "0644"
  register: power_tuned_balanced

# p1-balanced used to ship its own script.sh; it now inherits everything
# outside [cpu] from p1-performance, which has no [script] section.
- name: "Power: remove obsolete p1-balanced script"
  file:
    path: /etc/tuned/profiles/p1-balanced/script.sh
    state: absent

- name: "Power: deploy p1-performance profile"
  copy:
    src: tuned/p1-performance/tuned.conf
    dest: /etc/tuned/profiles/p1-performance/tuned.conf
    mode: "0644"
  register: power_tuned_performance

# --------------------------------------------------------------------------
# 5. tuned-ppd configuration
# --------------------------------------------------------------------------
- name: "Power: deploy tuned-ppd profile mapping"
  copy:
    src: ppd.conf
    dest: /etc/tuned/ppd.conf
    mode: "0644"
  register: power_tuned_ppd

# --------------------------------------------------------------------------
# 5b. Fan control (thinkfan)
# --------------------------------------------------------------------------
# thinkfan is AUR-only. Fresh installs get it from the arches-local repo
# (platforms/x86-64/platform.toml [aur_packages]). The package also ships
# /usr/lib/modprobe.d/thinkpad_acpi.conf (fan_control=1), which takes
# effect at the next boot / thinkpad_acpi reload.
- name: "Power: install thinkfan"
  pacman:
    name: thinkfan
    state: present

# On a running system that just got thinkfan, the modprobe option is not
# active yet. fan_control is read-only (0444), so reload the module.
# Nothing depends on thinkpad_acpi, so this is safe while running.
#
# thinkpad_acpi loads from the initramfs, which only sees the modprobe.d
# files present when it was built. If fan_control is off at this point,
# the initramfs predates the option: without a rebuild, every reboot
# brings fan_control=N back and thinkfan crash-loops while the EC curve
# runs the fans at ~3,300 RPM.
- name: "Power: read thinkpad_acpi fan_control state"
  slurp:
    src: /sys/module/thinkpad_acpi/parameters/fan_control
  register: power_fan_control
  failed_when: false

- name: "Power: reload thinkpad_acpi to enable fan_control"
  shell: modprobe -r thinkpad_acpi && modprobe thinkpad_acpi
  when:
    - power_fan_control.content is defined
    - (power_fan_control.content | b64decode | trim) != "Y"

# limine-mkinitcpio on Limine systems: they have no mkinitcpio presets.
- name: "Power: rebuild initramfs so fan_control survives reboots"
  shell: |
    if command -v limine-mkinitcpio >/dev/null; then
        limine-mkinitcpio
    else
        mkinitcpio -P
    fi
  when:
    - power_fan_control.content is defined
    - (power_fan_control.content | b64decode | trim) != "Y"

- name: "Power: deploy thinkfan fan curve"
  copy:
    src: thinkfan.yaml
    dest: /etc/thinkfan.yaml
    mode: "0644"
  register: power_thinkfan_conf

- name: "Power: create thinkfan drop-in directory"
  file:
    path: /etc/systemd/system/thinkfan.service.d
    state: directory
    mode: "0755"

- name: "Power: deploy thinkfan restart-on-failure drop-in"
  copy:
    src: thinkfan-restart.conf
    dest: /etc/systemd/system/thinkfan.service.d/restart.conf
    mode: "0644"
  register: power_thinkfan_dropin

# --------------------------------------------------------------------------
# 6. `power` CLI tool
# --------------------------------------------------------------------------
- name: "Power: deploy power CLI script"
  copy:
    src: power
    dest: /usr/local/bin/power
    mode: "0755"

- name: "Power: create helper directory"
  file:
    path: /usr/local/lib/power
    state: directory
    mode: "0755"

- name: "Power: deploy charge threshold helper"
  copy:
    src: set-charge-thresholds
    dest: /usr/local/lib/power/set-charge-thresholds
    mode: "0755"

- name: "Power: deploy fan curve measurement tool"
  copy:
    src: fan-test
    dest: /usr/local/lib/power/fan-test
    mode: "0755"

- name: "Power: deploy sudoers rules"
  copy:
    src: power-sudoers
    dest: /etc/sudoers.d/power
    mode: "0440"
    validate: 'visudo -cf %s'

# --------------------------------------------------------------------------
# 7. Clean up old gpu-ollama files
# --------------------------------------------------------------------------
- name: "Power: remove old gpu-ollama script"
  file:
    path: /usr/local/bin/gpu-ollama
    state: absent

- name: "Power: remove old gpu-ollama sudoers"
  file:
    path: /etc/sudoers.d/gpu-ollama
    state: absent

# --------------------------------------------------------------------------
# 8. Enable services
# --------------------------------------------------------------------------
- name: "Power: enable tuned"
  systemd:
    name: tuned.service
    enabled: yes
    state: started

- name: "Power: enable tuned-ppd"
  systemd:
    name: tuned-ppd.service
    enabled: yes
    state: started

# tuned reads profiles only when it (re)applies one, so changed profile
# files would otherwise wait for the next profile switch or reboot.
# tuned-ppd keeps its own copy of ppd.conf, so restart it too.
- name: "Power: restart tuned after profile changes"
  systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - tuned.service
    - tuned-ppd.service
  when: >-
    power_tuned_powersave.changed or power_tuned_balanced.changed
    or power_tuned_performance.changed or power_tuned_ppd.changed

# Enabling thinkfan.service also enables thinkfan-sleep/-wakeup (Also=),
# which hand the fan back to the EC around suspend.
- name: "Power: enable thinkfan"
  systemd:
    name: thinkfan.service
    enabled: yes
    state: started
    daemon_reload: yes

- name: "Power: restart thinkfan after config changes"
  systemd:
    name: thinkfan.service
    state: restarted
  when: power_thinkfan_conf.changed or power_thinkfan_dropin.changed

# --------------------------------------------------------------------------
# 9. Disable ollama and open-webui auto-start (managed by `power` script)
# --------------------------------------------------------------------------
- name: "Power: disable ollama auto-start"
  systemd:
    name: ollama.service
    enabled: no
  failed_when: false

- name: "Power: disable open-webui auto-start (user service)"
  become_user: "{{ ansible_user | default('brian') }}"
  systemd:
    name: open-webui.service
    scope: user
    enabled: no
  failed_when: false
