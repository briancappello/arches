[meta]
name = "VM Server"
description = "Headless server — nginx, postgres, redis, SSH"

[system]
timezone = "America/Denver"
locale = "en_US.UTF-8"

# Headless: sshd runs (keys only: declare them in the install config's
# [ssh] authorized_keys) and firewalld lets it in.
[ssh]
enable = true
open_firewall = true

[modules]
include = [
    # Base
    "base",
    "zsh",
    "dev-tools",
    # Networking
    "networking",
    # Services
    "postgresql",
    "redis",
    "nginx",
]
