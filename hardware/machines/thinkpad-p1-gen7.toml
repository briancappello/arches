# Machine profile: Lenovo ThinkPad P1 Gen 7
#
# Intel Meteor Lake-P (Intel Arc Graphics) + NVIDIA RTX 3000 Ada
# hybrid laptop.  Custom tuned power profiles, NVIDIA RTD3 GPU power
# management, and ThinkPad-specific battery charge threshold control.

[machine]
name = "ThinkPad P1 Gen 7"
description = "Intel Meteor Lake + NVIDIA RTX 3000 Ada hybrid laptop"
platform = "x86-64"

[match]
sys_vendor = "LENOVO"
product_name_pattern = "21KW*"

[quirks]
include = [
    "intel-wifi7-disable-be",
    "nvidia-rtd3-laptop",
]

[packages]
install = [
    "tp_smapi",          # ThinkPad battery management (SMAPI interface)
    "acpi_call",         # ACPI call interface for battery thresholds
    "tuned",             # Power profile daemon
    "tuned-ppd",         # power-profiles-daemon compatibility layer
    "thermald",          # Intel thermal management daemon
    "thinkfan",          # Custom fan curve (AUR, pre-built into arches-local).
                         # Not enabled here: the power role deploys
                         # /etc/thinkfan.yaml, then enables the service.
]

[services]
enable = [
    "tuned",
    "tuned-ppd",
    "thermald",
]

[ansible]
firstboot_roles = ["power", "edp-recovery"]

# Both internal 1 TB NVMe disks (a Micron and a Sabrent on p1) carry the
# "spare" partitions that disk-layouts/p1-spare.toml installs into.
[[disks]]
name = "spare-pair"
device = "1TB NVMe SSD"

[modprobe]
# Internal panel stays black after resume / lid-open. Kernel logs:
#   *ERROR* Timeout waiting for DDI BUF A to get active   (link power-up race)
#   PSR wait timed out, atomic update may fail            (PSR engine wedge)
#
# enable_psr=0 enable_panel_replay=0 : PSR wedges become impossible.
# enable_dc=0 : no DC5/DC6 display power gating, so DDI power-up cannot
#               race the DMC firmware.
#
# Costs ~1 W at idle. Revisit after BIOS/kernel updates: drop this entry,
# rescan, reboot, and watch the kernel log. The edp-recovery role stays as
# a safety net either way.
"arches-i915-psr.conf" = """\
options i915 enable_psr=0 enable_panel_replay=0 enable_dc=0\
"""

[udev]
# Lid transitions must not wake the machine.
#
# Meteor Lake exposes no ACPI S3 on this platform — /sys/power/mem_sleep
# offers only [s2idle], with no "deep" option and no firmware toggle to
# bring one back.  The ACPI lid device fires its wake GPE on ANY lid
# transition, not just open, so closing the lid after the machine has
# already suspended wakes it straight back up.  logind then refuses to
# re-suspend for HoldoffTimeoutSec (30s), leaving the machine running
# with the lid shut.
#
# Consequence: the power button (SLPB, left enabled) becomes the only
# wake source.  Lid-close still suspends — that is logind's
# HandleLidSwitch, a separate userspace path this rule does not touch.
#
# ATTR is a set, not a toggle, so this is idempotent — unlike writing
# the device name to /proc/acpi/wakeup, which flips state on each write.
"81-lid-no-wakeup.rules" = """\
SUBSYSTEM=="platform", KERNEL=="PNP0C0D:*", ATTR{power/wakeup}="disabled"\
"""
